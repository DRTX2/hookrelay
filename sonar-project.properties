sonar.projectKey=DRTX2_hookrelay
sonar.organization=drtx2
sonar.projectName=Hookrelay
sonar.sources=apps/api/src,apps/web/app,apps/web/lib
sonar.tests=apps/api/test
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info
# Unit coverage is gated on the delivery core; controllers/adapters are covered by the
# black-box integration suite (separate processes), so they are excluded from the % metric.
sonar.coverage.exclusions=apps/web/**,apps/api/src/main.ts,apps/api/src/worker.ts,apps/api/src/modules.ts,apps/api/src/**/*.controller.ts,apps/api/src/common/**,apps/api/src/db/**,apps/api/src/delivery/infrastructure/**,!apps/api/src/delivery/infrastructure/ssrf.ts
