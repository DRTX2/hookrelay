global:
  scrape_interval: 10s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: api
    static_configs: [{ targets: ['api:3000'] }]
  - job_name: worker
    # every worker replica, discovered through Docker DNS (one A record per replica)
    dns_sd_configs: [{ names: ['worker'], type: A, port: 9464 }]
